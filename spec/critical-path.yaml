# Critical-path manifest for the 14 primitives that must carry Lean 4 model soundness
# before the campaign is complete. `status: covered` means: a model statement exists, a
# substantive soundness theorem is proved and axiom-audited, every arm is mapped to a
# `proved-model` flow rule, and at least one behavioural suite is mapped.
schema: rsure.critical-path/v1
review_date: 2026-11-05
tie:
  status: model-only
  note: >-
    These are proofs about the shallow state-machine models in spec/lean, not refinements
    of the Rholang contracts. Every primitive records its refinement_gap in claims.yaml.

primitives:
  - id: CP-01
    name: RootAuthority
    status: covered
    arms:
      - 'SureRoot@"register"'
      - 'SureRoot@"rotate"'
      - 'SureRoot@"freeze"'
      - 'SureRoot@"admin"'
    source:
      - contracts/src/deploy/00_root.rho
    model: spec/lean/RSure/Model/Root.lean
    soundness: RSure.Model.Root.root_register_sound
    theorems:
      - RSure.Model.Root.root_register_sound
      - RSure.Model.Root.root_rotate_sound
      - RSure.Model.Root.root_freeze_sound
      - RSure.Model.Root.root_admin_sound
      - RSure.Model.Root.root_register_refuses_frozen
      - RSure.Model.Root.root_register_reachable
    required_classes: [authority]
    invariants: []
    assumptions: [crypto.authority, deploy.atomicity]
    suite: [unit_root, unit_factory_auth, unit_replay]
    hazards: [HZ-008]
