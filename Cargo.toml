[workspace]
resolver = "2"
exclude = [".devnet/parse-check"]
members = [
  "crates/rsure-core",
  "crates/rsure-keystore",
  "crates/rsure-sdk",
  "crates/rsure-cli",
  "crates/rsure-wasm",
]
default-members = [
  "crates/rsure-core",
  "crates/rsure-keystore",
  "crates/rsure-sdk",
  "crates/rsure-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.95"
repository = "https://github.com/rhovision-org/r-sure"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
rsure-core = { path = "crates/rsure-core" }
rsure-keystore = { path = "crates/rsure-keystore" }
rsure-sdk = { path = "crates/rsure-sdk", default-features = false }

rcash-core = { git = "https://github.com/rhovision-org/r-cash", rev = "49b441dea4f5561992387ed670ab263fcd5dd164" }
rcash-chain = { git = "https://github.com/rhovision-org/r-cash", rev = "49b441dea4f5561992387ed670ab263fcd5dd164", default-features = false }
rcash-sdk = { git = "https://github.com/rhovision-org/r-cash", rev = "49b441dea4f5561992387ed670ab263fcd5dd164", default-features = false }
rchain-crypto = { git = "https://github.com/rhovision-org/rholo", rev = "841cb842876369deaa63e3b3e26c20d60e6c74c6", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
sha3 = "0.12"
aes = "0.9"
ctr = "0.10"
scrypt = "0.12"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "time", "rt", "rt-multi-thread", "sync"] }
