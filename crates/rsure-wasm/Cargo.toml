[package]
name = "rsure-wasm"
description = "wasm-bindgen facade for the r-sure browser client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
rsure-core.workspace = true
rsure-keystore.workspace = true
rsure-sdk = { workspace = true, default-features = false, features = ["wasm"] }
rcash-chain = { workspace = true, default-features = false, features = ["wasm"] }
rchain-crypto.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true

[lints]
workspace = true
