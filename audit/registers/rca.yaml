schema: rsure.rca/v1
records:
- id: RCA-001
  title: Install blocked by RSpace continuation decode and open contract bindings
  date: '2026-11-05'
  owner: audit
  severity: P0
  status: closed
  template: audit/rca/template.md
  nodes:
  - N16
  - N17
  - N18
  - N19
  findings:
  - F-022
  - F-023
  - F-024
  - F-025
  hazards:
  - HZ-028
  - HZ-029
  - HZ-030
  - HZ-031
  - HZ-032
  - HZ-033
  - HZ-034
  - HZ-035
  experiments:
  - X-001
  - X-002
  - X-003
  - X-004
  - X-005
  - X-006
  - X-007
  - X-008
  - X-009
  - X-010
  incident: The 17-term install stopped at 12_risk. The deploy stayed Pooled until the
    180-second client timeout and the chain stopped advancing. The node log showed
    repeated `decode continuation failed` proposer errors. A second contract-level
    defect was present in 12_risk (wildcard auth binder) and a third in 13_slip
    (authIsOwner missing from the top-level new); the harness also raced the node
    proposer by calling manual propose on an autopropose node.
  fault_tree:
    top_event: The install cannot complete and the chain cannot advance
    gate: OR
    evidence:
    - audit/evidence/2026-11-05-install-rca/install-baseline.log
    - audit/evidence/2026-11-05-install-rca/node.log
    children:
    - event: RSpace continuation decode fails on the next proposal
      gate: AND
      evidence:
      - audit/evidence/2026-11-05-install-rca/node.log
      children:
      - event: prost's default decode recursion limit is 100
        gate: LEAF
        evidence:
        - ../RNodeRust/models/Cargo.toml
      - event: a normalized Par from 10_syndicate is deeper than 100
        gate: LEAF
        evidence:
        - audit/evidence/2026-11-05-install-rca/node.log
      - event: no regression decoded a deep Par on the RSpace path
        gate: LEAF
        evidence:
        - audit/evidence/2026-11-05-install-rca/node/deep_par_codec.rs
    - event: the 12_risk deploy is rejected
      gate: AND
      evidence:
      - audit/evidence/2026-11-05-install-rca/install-baseline.log
      children:
      - event: the bundled Risk body uses a wildcard auth receive
        gate: LEAF
        evidence:
        - contracts/src/deploy/12_risk.rho
      - event: the static bundle scanner did not model the wildcard-binder class
        gate: LEAF
        evidence:
        - tools/check_bundle_closedness.py
    - event: the 13_slip deploy is rejected
      gate: AND
      evidence:
      - audit/evidence/2026-11-05-install-rca/install-recursion-fix.log
      children:
      - event: authIsOwner is absent from the Slip term's top-level new
        gate: LEAF
        evidence:
        - contracts/src/deploy/13_slip.rho
      - event: no gate compares helper names with top-level bindings
        gate: LEAF
        evidence:
        - tools/parse_check.sh
    - event: the harness masks the node internal error
      gate: AND
      evidence:
      - audit/evidence/2026-11-05-install-rca/install-baseline.log
      children:
      - event: the deploy stays Pooled until the 180-second timeout
        gate: LEAF
        evidence:
        - harness/deploy.py
      - event: the harness calls manual propose while the node advertises autopropose
        gate: LEAF
        evidence:
        - audit/evidence/2026-11-05-install-rca/status.json
  five_whys:
  - question: Why did the install stop?
    answer: The 12_risk deploy never reached a processed state; it stayed Pooled until
      the client timeout.
  - question: Why did the deploy stay Pooled?
    answer: The proposer produced no block, so no deploy could be included or processed.
  - question: Why did the proposer produce no block?
    answer: The proposer failed to decode the RSpace continuation and logged `decode
      continuation failed` on every attempt.
  - question: Why did the decode fail?
    answer: RNodeRust's Par wire codec used prost's default decode recursion limit of
      100, while the normalized Par from 10_syndicate was deeper than 100.
  - question: Why was the mismatch not caught earlier?
    answer: The codec tests covered encode and shallow round-trips, not a deep decode;
      the harness timeout hid the proposer error; and install was the only E2 path, so
      no static gate exercised the node codec. The same pass also found two contract
      binding defects and an autopropose race that made the failure harder to read.
  hypotheses:
  - id: H-001
    statement: A contract-logic defect in 12_risk alone causes the install stall.
    status: partial
    note: 12_risk did have a wildcard-binder defect, but the chain stall was the node
      codec. Fixing the contract alone would not advance the chain.
  - id: H-002
    statement: RNodeRust's Par decoder rejects the normalized RSpace continuation because
      prost's default recursion limit (100) is below the normalized Par depth.
    status: supported
    note: X-002, X-003, X-004 and X-005 support this; X-005 verifies the rebuilt node.
  - id: H-003
    statement: The harness calling manual propose on an autopropose node is the root
      cause of the stall.
    status: rejected
    note: X-006 removes the extra propose and the install still fails; it is a masking
      and race factor, not the root cause.
  - id: H-004
    statement: The bundled Risk body's wildcard auth receive causes the 12_risk deploy
      to be rejected.
    status: supported
    note: X-007 and the 17-term install support this.
  - id: H-005
    statement: authIsOwner missing from the Slip term's top-level new causes the 13_slip
      deploy to be rejected.
    status: supported
    note: X-008 and the 17-term install support this.
  - id: H-006
    statement: The same fix fully bootstraps the r-cash rail.
    status: rejected
    note: X-009 shows 51_pool refused with parse depth exceeded; only the account factory
      is installed.
  - id: H-007
    statement: A green 17-term install verifies contract behaviour.
    status: rejected
    note: X-010 shows that install does not verify behaviour. The suite run records the
      root suite passing; the other registered suites remain not_run or unimplemented.
  root_cause: 'Root cause (F-022): RNodeRust built its Par wire codec with prost''s default
    decode recursion limit of 100. The parser/normalizer accept and normalize deploy
    terms deeper than that, so a valid term encodes but the RSpace continuation cannot
    be decoded on the next proposal; the proposer builds no block and the chain stops.
    Contributing defects in the same install: the 12_risk wildcard auth binder (F-023)
    and the missing 13_slip top-level authIsOwner binding (F-024) block their terms.
    The harness manual-propose race (F-025) masks the node error as a generic timeout
    but is not the root cause.'
  escape_analysis:
  - The static gates (build, measure, architecture, captures, select, placeholders,
    money, suites) never execute the node codec or the RSpace continuation path.
  - parse-check parses the terms with the target parser but does not encode, normalize
    and decode a continuation at the depth the parser accepts.
  - The codec tests covered encode and shallow round-trips; no test decoded a Par deeper
    than prost's default limit.
  - The harness converted the node's internal proposer error into a 180-second Pooled
    timeout, so the contract under deploy looked responsible.
  - Evidence schema v1 had no scope field, so install evidence and behavioural coverage
    could be conflated in prose.
  - The bundle scanner modelled free names but not the wildcard-binder bundle class, and
    no gate compared helper names with a term's top-level binding set.
  corrective_actions:
  - id: CA-01
    action: Enable prost no-recursion-limit and add the 130-deep Par round-trip test.
    owner: platform-node
    status: done
    findings:
    - F-022
    improvements:
    - R-022
  - id: CA-02
    action: Replace the wildcard auth receive with a named binder in the Risk arms.
    owner: contracts
    status: done
    findings:
    - F-023
    improvements:
    - R-023
  - id: CA-03
    action: Add authIsOwner to the Slip term's top-level new sequence.
    owner: contracts
    status: done
    findings:
    - F-024
    improvements:
    - R-024
  - id: CA-04
    action: Make the deploy harness autopropose-aware and keep strict propose for
      diagnosis.
    owner: harness
    status: done
    findings:
    - F-025
    improvements:
    - R-025
  - id: CA-05
    action: Add evidence schema v2 and the evidence, RCA and experiment checkers.
    owner: audit
    status: done
    findings:
    - F-025
    improvements:
    - R-025
  - id: CA-06
    action: Complete the behavioural campaign and record honest pass/fail/not_run; the
      root suite already passes.
    owner: audit-contracts
    status: open
    findings: []
    improvements: []
  - id: CA-07
    action: Resolve the r-cash 51_pool parser-depth refusal with the r-cash owner; the
      r-sure install does not depend on the pool.
    owner: external-rcash
    status: open
    findings: []
    improvements: []
  - id: CA-08
    action: Wire check_evidence.py, check_rca.py and check_experiments.py into
      `make audit-check`; the Makefile is owned by the lead.
    owner: lead
    status: open
    findings: []
    improvements: []
  verification:
    install:
      result: pass
      detail: 17/17 terms installed, including 12_risk and 13_slip.
      evidence:
      - audit/evidence/2026-11-05-install-rca/install-recursion-fix.log
    devnet:
      result: pass
      detail: fresh single-validator devnet reached preflight readiness.
      evidence:
      - audit/evidence/2026-11-05-install-rca/devnet-up-recursion-fix.log
      - audit/evidence/2026-11-05-install-rca/status-after-fix.json
    node_codec:
      result: implemented-not-executed
      detail: the no-recursion-limit feature and the 130-deep regression are in the
        RNodeRust tree; this evidence set has no test execution log.
      evidence:
      - ../RNodeRust/models/Cargo.toml
      - audit/evidence/2026-11-05-install-rca/node/deep_par_codec.rs
    rcash_rail:
      result: partial
      detail: account factory installed; 51_pool refused with parse depth exceeded.
      evidence:
      - audit/evidence/2026-11-05-install-rca/rcash-bootstrap-recursion-fix.log
    behavioural_suites:
      result: partial
      detail: The root suite passes with 11 assertions; the other registered suites are
        not_run or unimplemented. Install E2 is not behavioural coverage.
      evidence:
      - deployments/suite-results.json
  residual_risk:
  - The behavioural campaign is incomplete. The root suite passes, but the install
    proves deployment and block progress, not capacity, subscription, premium, claim or
    settlement behaviour.
  - The deep Par regression is 130 levels. A future term deeper than that may hit a new
    limit or cost bound; the node image is pinned by digest for this evidence only.
  - The r-cash pool and market rail are absent on this devnet after the 51_pool parse
    depth refusal; any r-sure suite that needs the pool is blocked until r-cash fixes it.
  - The manual-propose override remains available (RSURE_FORCE_PROPOSE=1); misuse on an
    autopropose node can reintroduce the race.
  - The audit remains internal and is not an independent review; no production-safety
    claim is made.
  evidence:
  - audit/evidence/2026-11-05-install-rca/manifest.json
  - audit/evidence/2026-11-05-install-rca/rca.md
  - audit/evidence/2026-11-05-install-rca/install-baseline.log
  - audit/evidence/2026-11-05-install-rca/node.log
  - audit/evidence/2026-11-05-install-rca/install-recursion-fix.log
  - audit/evidence/2026-11-05-install-rca/devnet-up-recursion-fix.log
  - audit/evidence/2026-11-05-install-rca/rcash-bootstrap-recursion-fix.log
  - audit/evidence/2026-11-05-install-rca/status-after-fix.json
  - harness/deploy.py
  - contracts/src/deploy/12_risk.rho
  - contracts/src/deploy/13_slip.rho
  - ../RNodeRust/models/Cargo.toml
  - ../RNodeRust/models/src/wire.rs
  - audit/evidence/2026-11-05-install-rca/node/deep_par_codec.rs
- id: RCA-002
  title: Mutating match refusal paths consume the state cell without reposting
  date: '2026-11-07'
  owner: contracts-audit
  severity: P1
  status: closed
  template: audit/rca/template.md
  nodes:
  - N05
  - N06
  - N10
  - N11
  - N13
  findings:
  - F-027
  hazards:
  - HZ-037
  experiments: []
  incident: The match-style audit found 19 mutating matches that replied on a refusal arm
    without reposting the state cell consumed before dispatch. Duplicate broker or syndicate
    registration reaches the arm in normal use; component-unavailable and malformed-reply
    arms reach it in Policy, Distribution, Syndicate and LineSettle. The cell is empty
    afterwards and the next take or peek blocks.
  fault_tree:
    top_event: The instance cell is empty after a refusal
    gate: OR
    evidence:
    - audit/evidence/2026-11-07-match-style/before-report.txt
    children:
    - event: Duplicate registration loses the book cell
      gate: AND
      evidence:
      - contracts/src/deploy/11_broker.rho
      children:
      - event: The registration match consumes brokerBookState or syndicateBookState
          before dispatch
        gate: LEAF
        evidence:
        - contracts/src/deploy/10_syndicate.rho
        - contracts/src/deploy/11_broker.rho
      - event: The duplicate-owner arm replies without reposting
        gate: LEAF
        evidence:
        - audit/evidence/2026-11-07-match-style/before-report.txt
    - event: A failed component lookup loses the object cell
      gate: AND
      evidence:
      - contracts/src/deploy/17_policy.rho
      children:
      - event: A lookup or helper reply returns a non-success tuple
        gate: LEAF
        evidence:
        - contracts/src/deploy/15_distribution.rho
        - contracts/src/deploy/17_policy.rho
      - event: The defensive arm replies without reposting the held cell
        gate: LEAF
        evidence:
        - audit/evidence/2026-11-07-match-style/before-report.txt
  five_whys:
  - question: Why did the instance stop responding?
    answer: The state cell was consumed and never reposted, so the next take had no datum.
  - question: Why was it never reposted?
    answer: The refusal arm copied the success reply but not the repost.
  - question: Why did the copy omit the repost?
    answer: The arm sat at depth 4-7 inside a ladder; the consume was far above and the
      repost was not visible at the refusal site.
  - question: Why was the ladder accepted?
    answer: There was no rule about mutating-match totality or dispatch depth.
  - question: Why was it not caught earlier?
    answer: The suites exercise success paths, and no static gate linked a mutating match
      to a repost; the concurrency review is manual.
  hypotheses:
  - id: H-001
    statement: Duplicate registration in BrokerBook.create and SyndicateBook.create loses
      the book cell and is reachable in normal use.
    status: supported
    note: The consume precedes the duplicate check and the refusal replies without a repost.
  - id: H-002
    statement: Component-unavailable and malformed-reply arms in Policy, Distribution,
      Syndicate and LineSettle lose the object cell.
    status: supported
    note: The same shape appears in 19 sites in before-report.txt.
  - id: H-003
    statement: The style refactor alone proves the absence of state loss.
    status: rejected
    note: The gate is a shape check; the suites and the local reducer remain the
      behavioural evidence.
  root_cause: Refusal arms for mutating matches were written without the repost that the
    success path had, and the deep ladders separated the consume from the refusal so the
    ownership was not visible at the arm. The process gap was the absence of a rule and a
    gate that every mutating match ends in a total arm that reposts and replies.
  escape_analysis:
  - The concurrency review is manual and reasoned about success paths.
  - The behavioural suites do not exercise duplicate registration or a failing component
    lookup.
  - The static gates checked bundles, captures, money, placeholders and arm inventory, but
    not match totality.
  - Deep ladders made the consume and the refusal textually distant.
  corrective_actions:
  - id: CA-01
    action: Repost the held snapshot on every refusal arm and add a total arm where one
      was missing.
    owner: contracts
    status: done
    findings:
    - F-027
    improvements:
    - R-027
  - id: CA-02
    action: Add the match-style scanner and wire it into spec-check.
    owner: audit
    status: done
    findings:
    - F-026
    improvements:
    - R-029
  - id: CA-03
    action: Flatten the handlers so one consume and one repost owner are visible per path.
    owner: contracts
    status: done
    findings:
    - F-026
    improvements:
    - R-026
  - id: CA-04
    action: Cover duplicate registration and component-failure arms in the behavioural
      suites.
    owner: contracts-audit
    status: open
    findings:
    - F-027
    improvements:
    - R-027
  verification:
    match_gate:
      result: pass
      detail: 403 sites, 0 violations, 0 suppressions, depth histogram max 3.
      evidence:
      - audit/evidence/2026-11-07-match-style/gate.txt
    match_self_test:
      result: pass
      detail: 14 fixture groups.
      evidence:
      - audit/evidence/2026-11-07-match-style/self-test.txt
    parse_and_normalize:
      result: pass
      detail: built and rendered terms parse and normalize.
      evidence:
      - audit/evidence/2026-11-07-match-style/gate.txt
    duplicate_registration_regression:
      result: implemented-not-executed
      detail: the arms are fixed; CA-04 tracks the behavioural regression.
      evidence:
      - audit/evidence/2026-11-07-match-style/rca.md
  residual_risk:
  - The scanner is heuristic; M-004 accepts a checked-helper forwarding, not a proof that
    the call completes.
  - Duplicate registration and component-failure arms are not yet covered by a behavioural
    suite (CA-04).
  - The audit is internal, not independent.
  evidence:
  - audit/evidence/2026-11-07-match-style/manifest.json
  - audit/evidence/2026-11-07-match-style/rca.md
  - audit/evidence/2026-11-07-match-style/before-report.txt
  - audit/evidence/2026-11-07-match-style/after-report.txt
  - audit/evidence/2026-11-07-match-style/gate.txt
  - audit/evidence/2026-11-07-match-style/self-test.txt
  - contracts/src/deploy/10_syndicate.rho
  - contracts/src/deploy/11_broker.rho
  - contracts/src/deploy/15_distribution.rho
  - contracts/src/deploy/17_policy.rho
  - tools/check_match_style.py
