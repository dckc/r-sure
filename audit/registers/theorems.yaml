- id: TH-006
  name: share_sum_le
  module: RSure.Basic
  kind: theorem
  status: proved-model
  statement: '(amount : Nat) : ∀ bpses : List Nat, sumNat (bpses.map (fun b => share
    amount b)) ≤ share amount (sumNat bpses) | [] => by simp [sumNat] | b :: bs =>
    by simp only [List.map_cons, sumNat] calc share amount b + sumNat (bs.map (fun
    b => share amount b)) ≤ share amount b + share amount (sumNat bs)'
  axioms:
  - propext
  scope: shallow Lean component model; not a Rholang refinement
  evidence: spec/lean/RSure/Basic.lean
  reviewer: internal
  audit_line: true
