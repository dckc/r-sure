- id: F-014
  title: Line.pay trusts a claimId without policy binding
  severity: P2
  class: composition
  status: accepted
  confidence: high
  components:
  - Line
  - Policy
  arms:
  - Line@"pay"
  - Policy@"settleClaim"
  hazards:
  - HZ-019
  invariants:
  - INV-8
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy
  description: 'Accepted boundary: the policy token plus the policy claims map is
    the claim-to-policy binding; Line.pay is only reachable through the policy token.
    A leaked policy token is capability theft, outside this invariant.'
  preconditions: A caller reaches the arm on the affected path.
  impact: A cross-policy claimId could be paid if the policy token is leaked.
  proposed_fix: R-014
  reviewer: internal
  verified_at: '2026-11-05'
