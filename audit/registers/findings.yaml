- id: F-020
  title: Policy.settleClaim can pay more than the remaining aggregate
  severity: P1
  class: invariant
  status: fixed
  confidence: high
  components:
  - Policy
  arms:
  - Policy@"settleClaim"
  hazards:
  - HZ-026
  invariants:
  - INV-9
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy/04_math.rho
  - kind: source
    ref: contracts/src/deploy/17_policy.rho
  - kind: lean
    ref: spec/lean/RSure/Model/Policy.lean
  - kind: tool
    ref: tools/check_invariant_guards.py
  description: SureMath@"payable" now computes the documented three-way minimum, and
    Policy@"settleClaim" reposts state and propagates any math refusal before value
