  - HZ-017
  invariants:
  - INV-7
  - INV-8
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy
  description: The line calls the syndicate capability first and updates its own cell
    after.
  preconditions: A caller reaches the arm on the affected path.
  impact: If the update cannot complete, value has moved without a line record.
  proposed_fix: R-012
  reviewer: internal
  verified_at: '2026-11-05'
- id: F-013
