findings:
- id: F-001
  title: Eight arms take-await-take the same state cell
  severity: P0
  class: concurrency
  status: fixed
  confidence: high
  components:
  - Syndicate
  - Slip
  - Policy
  - Claim
  - Distribution
  arms:
  - Syndicate@"openLine"
  - Slip@"bind"
  - Policy@"distribute"
  - Policy@"openClaim"
  - Policy@"settleClaim"
  - Claim@"settle"
  - Claim@"dispute"
  - Distribution@"run"
  hazards:
  - HZ-001
  - HZ-002
  - HZ-003
  - HZ-004
  - HZ-005
  - HZ-025
  invariants:
  - INV-11
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy
  description: The first consume is never reposted; a later consume of the same cell
    blocks because the only datum was taken.
  preconditions: A caller reaches the arm on the affected path.
  impact: Cornerstone flows hang; no policy bind, premium distribution, settlement
    or dispute completes.
  proposed_fix: R-001
  reviewer: internal
  verified_at: '2026-11-05'
- id: F-002
  title: Instance bundles capture state/capabilities
  severity: P0
  class: concurrency
  status: confirmed
  confidence: high
  components:
  - Syndicate
  - LineGrant
  - Line
  - Slip
  - Policy
  - Claim
  - Distribution
  - Broker
  - Risk
  arms:
  - SyndicateBook@"create"
  - Syndicate@"openLine"
  - LineFactory@"create"
  - SlipFactory@"open"
  - PolicyFactory@"create"
  - ClaimFactory@"create"
  hazards:
  - HZ-006
  - HZ-007
  invariants:
  - INV-11
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy
  description: Nine per-object contracts are published with bundle+{*X} while X's
    body references a state cell or token created outside X. The node rejects the
    bundle.
  preconditions: A caller reaches the arm on the affected path.
  impact: Devnet install is blocked; no instance can be created.
  proposed_fix: R-002
  reviewer: internal
  verified_at: '2026-11-05'
- id: F-003
  title: Global pause is dead
  severity: P1
  class: composition
  status: confirmed
  confidence: high
  components:
  - SureAdmin
  arms:
  - SureAdmin@"admin"
  hazards:
  - HZ-008
  invariants:
  - INV-12
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy
  description: pauseAll writes pausedAll but no mutating arm reads isPaused.
  preconditions: A caller reaches the arm on the affected path.
  impact: Operators cannot pause the market; the pause-scope invariant is vacuous.
  proposed_fix: R-003
  reviewer: internal
  verified_at: '2026-11-05'
- id: F-004
  title: SureFund mixes nonce and govNonce
  severity: P1
  class: composition
  status: fixed
  confidence: high
  components:
  - SureFund
  arms:
  - SureFund@"cover"
  - SureFund@"admin"
  hazards:
  - HZ-009
  invariants:
  - INV-8
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy
  description: cover writes nonce and has no govNonce replay check; admin uses govNonce.
  preconditions: A caller reaches the arm on the affected path.
  impact: Cover replay analysis is inconsistent and a repeated cover can be attempted.
  proposed_fix: R-004
  reviewer: internal
  verified_at: '2026-11-05'
- id: F-005
  title: Books are never populated
  severity: P1
  class: composition
  status: confirmed
  confidence: high
  components:
  - PolicyBook
  - ClaimBook
  - Policy
  - Claim
  arms:
  - PolicyBook@"register"
  - ClaimBook@"register"
  hazards:
  - HZ-010
  invariants:
  - INV-8
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy
  description: Policy and Claim creation never call the books.
  preconditions: A caller reaches the arm on the affected path.
  impact: Discovery indexes are empty; clients cannot enumerate policies/claims on-chain.
  proposed_fix: R-005
  reviewer: internal
  verified_at: '2026-11-05'
- id: F-006
  title: Policy expiry does not release lines
  severity: P1
  class: composition
  status: fixed
  confidence: high
  components:
  - Policy
  - Line
  arms:
  - Policy@"expire"
  hazards:
  - HZ-011
  invariants:
  - INV-7
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy
  description: expire sets status expired without calling Line.release.
  preconditions: A caller reaches the arm on the affected path.
  impact: Written capacity is never returned; syndicates leak capacity.
  proposed_fix: R-006
  reviewer: internal
  verified_at: '2026-11-05'
- id: F-007
