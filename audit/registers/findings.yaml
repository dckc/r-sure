findings:
- id: F-001
  title: Eight arms take-await-take the same state cell
  severity: P0
  class: concurrency
  status: fixed
  confidence: high
  components:
  - Syndicate
  - Slip
  - Policy
  - Claim
  - Distribution
  arms:
  - Syndicate@"openLine"
  - Slip@"bind"
  - Policy@"distribute"
  - Policy@"openClaim"
  - Policy@"settleClaim"
  - Claim@"settle"
  - Claim@"dispute"
  - Distribution@"run"
  hazards:
  - HZ-001
  - HZ-002
  - HZ-003
  - HZ-004
  - HZ-005
  - HZ-025
  invariants:
  - INV-11
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy
  description: The first consume is never reposted; a later consume of the same cell
    blocks because the only datum was taken.
  preconditions: A caller reaches the arm on the affected path.
  impact: Cornerstone flows hang; no policy bind, premium distribution, settlement
    or dispute completes.
  proposed_fix: R-001
  reviewer: internal
  verified_at: '2026-11-05'
- id: F-002
  title: Instance bundles capture state/capabilities
  severity: P0
  class: concurrency
  status: fixed
  confidence: high
  components:
  - Syndicate
  - LineGrant
  - Line
  - Slip
  - Policy
  - Claim
  - Distribution
  - Broker
  - Risk
  arms:
  - SyndicateBook@"create"
  - Syndicate@"openLine"
  - LineFactory@"create"
  - SlipFactory@"open"
  - PolicyFactory@"create"
  - ClaimFactory@"create"
  hazards:
  - HZ-006
  - HZ-007
  invariants:
  - INV-11
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy/13_slip.rho
  - kind: tool
    ref: tools/check_bundle_closedness.py
  - kind: tool
    ref: tools/parse_check.sh
  description: 'Fix: split the deep Slip arms into slipSubscribe/slipFundDeposit/slipBindPolicy
    helpers, then rebind all maker parameters through cfg channels before publishing
    bundle+{*Slip}. The bundle scanner and parser are clean; make install remains
    the E2 check.'
  preconditions: A caller reaches the arm on the affected path.
  impact: Devnet install is blocked; no instance can be created.
  proposed_fix: R-002
  reviewer: internal
  verified_at: '2026-11-05'
- id: F-003
  title: Global pause is dead
  severity: P1
  class: composition
  status: fixed
  confidence: high
  components:
  - SureAdmin
  arms:
  - SyndicateBook@"create"
  - Syndicate@"quote"
  - Syndicate@"openLine"
  - Broker@"addSlip"
  - RiskBook@"submit"
  - Risk@"accept"
  - Risk@"decline"
  - SureFund@"contribute"
  hazards:
  - HZ-008
  invariants:
  - INV-12
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy/10_syndicate.rho
  - kind: source
    ref: contracts/src/deploy/11_broker.rho
  - kind: source
    ref: contracts/src/deploy/12_risk.rho
  - kind: source
    ref: contracts/src/deploy/16_fund.rho
  - kind: tool
    ref: tools/check_pause_scope.py
  description: New-risk capacity arms consult component:admin isPaused through a per-file
    fail-closed helper. Slip binding is blocked through the gated Syndicate quote/openLine
    path; Slip-level gates were omitted because 13_slip exceeds the parser depth limit.
    Policy.distribute is treated as an existing-policy value-out and stays exempt.
  preconditions: A caller reaches the arm on the affected path.
  impact: Operators cannot pause the market; the pause-scope invariant is vacuous.
  proposed_fix: R-003
  reviewer: internal
  verified_at: '2026-11-05'
- id: F-004
  title: SureFund mixes nonce and govNonce
  severity: P1
  class: composition
  status: fixed
  confidence: high
  components:
  - SureFund
  arms:
  - SureFund@"cover"
  - SureFund@"admin"
  hazards:
  - HZ-009
  invariants:
  - INV-8
  evidence_level: E1
  evidence:
  - kind: source
    ref: contracts/src/deploy
  description: cover writes nonce and has no govNonce replay check; admin uses govNonce.
  preconditions: A caller reaches the arm on the affected path.
  impact: Cover replay analysis is inconsistent and a repeated cover can be attempted.
  proposed_fix: R-004
  reviewer: internal
  verified_at: '2026-11-05'
